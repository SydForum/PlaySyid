name = "airbeats-telegram-bot"
main = "worker.js"
compatibility_date = "2024-09-01"

# Automatically triggers daily leaderboard post at 12:00 UTC every day
[triggers]
crons = ["0 12 * * *"]

[vars]
STATS_BASE_URL = "https://db.drkvenom786.workers.dev"
STATS_API_KEY = "DARKBOY25-10-2006"

# Secrets to set via `npx wrangler secret put <NAME>` or Cloudflare Dashboard:
