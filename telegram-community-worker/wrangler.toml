name = "airbeats-telegram-bot"
main = "worker.js"
compatibility_date = "2024-09-01"

# Automatically triggers daily leaderboard post at 12:00 UTC every day
[triggers]
crons = ["0 12 * * *"]

[vars]
STATS_BASE_URL = "https://db.drkvenom786.workers.dev"
TELEGRAM_THREAD_ID = "3"
CRASH_THREAD_ID = "224"

# Secrets to configure via Cloudflare Dashboard or `npx wrangler secret put`:
# - STATS_API_KEY
# - TELEGRAM_BOT_TOKEN
# - TELEGRAM_CHAT_ID
# - ADMIN_TELEGRAM_ID

