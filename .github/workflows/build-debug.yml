name: Build APKs (Release, Nightly, Debug)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release, Nightly & Debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Remove local Java path from gradle.properties
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Google Services JSON and Keystore
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            echo "${GOOGLE_SERVICES_JSON}" | base64 --decode > app/google-services.json
          else
            cat <<EOF > app/google-services.json
          {
            "project_info": { "project_number": "1234567890", "project_id": "dummy-project" },
            "client": [ 
              { "client_info": { "mobilesdk_app_id": "1:1234567890:android:abcdef123456", "android_client_info": { "package_name": "com.darkxvenom.airbeats" } }, "api_key": [ { "current_key": "dummy-key" } ] },
              { "client_info": { "mobilesdk_app_id": "1:1234567890:android:abcdef123456", "android_client_info": { "package_name": "com.darkxvenom.airbeats.debug" } }, "api_key": [ { "current_key": "dummy-key" } ] }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          if [ -n "${SIGNING_KEY_BASE64}" ]; then
            echo "${SIGNING_KEY_BASE64}" | base64 --decode > app/keystore.jks
          fi

      - name: Build All APKs (Release, Nightly, Debug)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          SIGNING_PARAMS=""
          if [ -f "app/keystore.jks" ] && [ -n "${KEYSTORE_PASSWORD}" ]; then
            SIGNING_PARAMS="-Pandroid.injected.signing.store.file=${GITHUB_WORKSPACE}/app/keystore.jks -Pandroid.injected.signing.store.password=${KEYSTORE_PASSWORD} -Pandroid.injected.signing.key.alias=${KEY_ALIAS} -Pandroid.injected.signing.key.password=${KEY_PASSWORD}"
          fi
          ./gradlew assembleRelease assembleNightly assembleDebug $SIGNING_PARAMS

      - name: Prepare APKs & Changelog
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts || echo "4.3.0")
          
          # 1. Release APK
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "AirBeats-v${VERSION_NAME}-Release.apk"
          fi

          # 2. Nightly APK
          NIGHTLY_APK=$(find app/build/outputs/apk/nightly -name "*.apk" | head -n 1)
          if [ -n "$NIGHTLY_APK" ]; then
            cp "$NIGHTLY_APK" "AirBeats-v${VERSION_NAME}-Nightly.apk"
          fi

          # 3. Debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "AirBeats-v${VERSION_NAME}-Debug.apk"
          fi

          echo "FINAL_DEBUG_APK=AirBeats-v${VERSION_NAME}-Debug.apk" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

          # Generate commit changelog
          COMMITS=$(git log -n 5 --pretty=format:"• %s (%h)" --no-merges || echo "")
          if [ -z "$COMMITS" ]; then
            COMMITS="• Continuous integration build from main branch."
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AirBeats-Release-APK
          path: AirBeats-v*-Release.apk
          if-no-files-found: warn

      - name: Upload Nightly APK
        uses: actions/upload-artifact@v4
        with:
          name: AirBeats-Nightly-APK
          path: AirBeats-v*-Nightly.apk
          if-no-files-found: warn

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AirBeats-Debug-APK
          path: AirBeats-v*-Debug.apk
          if-no-files-found: warn

      - name: Upload Debug APK to Telegram (Topic 44)
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: "-1004388752678"
          THREAD_ID: "44"
          VERSION: ${{ env.VERSION_NAME }}
          APK_FILE: ${{ env.FINAL_DEBUG_APK }}
          RELEASE_TYPE: "Debug Build"
          CHANGELOG: ${{ env.CHANGELOG }}
          RELEASE_URL: "https://github.com/d0x-dev/AirBeats/actions/runs/${{ github.run_id }}"
        run: |
          pip install requests
          python3 .github/scripts/upload_to_telegram.py
