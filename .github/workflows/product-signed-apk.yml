name: Product Signed APK

on:
  workflow_dispatch:

jobs:
  build-product-apk:
    name: Build & Sign Product Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Remove local Java path from gradle.properties
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "${GOOGLE_SERVICES_JSON}" | base64 --decode > app/google-services.json
          echo "${SIGNING_KEY_BASE64}" | base64 --decode > app/keystore.jks
          

      - name: Build Product Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="${GITHUB_WORKSPACE}/app/keystore.jks" \
            -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${KEY_PASSWORD}"

      - name: Prepare APK Artifact
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts || echo "release")
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "Error: No release APK found in app/build/outputs/apk/release"
            exit 1
          fi
          FINAL_APK_NAME="AirBeats-v${VERSION_NAME}-Release-Signed.apk"
          cp "$RELEASE_APK" "$FINAL_APK_NAME"
          echo "FINAL_APK_NAME=$FINAL_APK_NAME" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Generate Changelog
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "nightly" | grep -v "beta" | head -n 1 || echo "")
          echo "Previous release tag: $PREV_TAG"
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"• %s (%h)" --no-merges || echo "")
          else
            CHANGELOG=$(git log -n 15 --pretty=format:"• %s (%h)" --no-merges || echo "")
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="• Official release of AirBeats v${{ env.VERSION_NAME }}"
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AirBeats-Product-Signed-APK
          path: ${{ env.FINAL_APK_NAME }}
          if-no-files-found: error
