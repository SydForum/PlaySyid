name: Temp Nightly Build

on:
  workflow_dispatch:
    inputs:
      admin_chat_ids:
        description: 'Comma-separated Telegram Admin Chat IDs to receive the APK in DM'
        required: false
        default: '8699611292,7335083822'

jobs:
  build-temp-nightly:
    name: Build & Send Temp Nightly APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Remove local Java path from gradle.properties
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read Current Version (No Bump)
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts || echo "nightly")
          VERSION_CODE=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts || echo "0")
          echo "Building Temp Nightly with existing version: $VERSION_NAME (Build $VERSION_CODE)"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Inject Secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "${GOOGLE_SERVICES_JSON}" | base64 --decode > app/google-services.json
          echo "${SIGNING_KEY_BASE64}" | base64 --decode > app/keystore.jks

      - name: Build Nightly APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ./gradlew assembleNightly \
            -Pandroid.injected.signing.store.file="${GITHUB_WORKSPACE}/app/keystore.jks" \
            -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${KEY_PASSWORD}"

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/nightly/app-nightly.apk "Airbeats-v${{ env.VERSION_NAME }}-Nightly-Temp.apk"
          echo "APK_NAME=Airbeats-v${{ env.VERSION_NAME }}-Nightly-Temp.apk" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirBeats-Temp-Nightly-APK
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Send APK to Admin DMs (No Topic)
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_IDS: ${{ inputs.admin_chat_ids || '8699611292,7335083822' }}
          THREAD_ID: ""
          VERSION: "${{ env.VERSION_NAME }} (Temp)"
          APK_FILE: ${{ env.APK_NAME }}
          RELEASE_TYPE: "Temp Nightly"
          CHANGELOG: "• Private temp nightly build for admin testing without version increment."
          RELEASE_URL: ""
          PIN_MESSAGE: "false"
        run: |
          pip install requests
          python3 .github/scripts/upload_to_telegram.py
